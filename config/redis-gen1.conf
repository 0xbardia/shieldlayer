# Dedicated gen1 Redis (port 6380). Do not reuse the host 6379 instance.
# Password lives in REDIS_URL / requirepass on the server, not in git.
bind 127.0.0.1
port 6380
protected-mode yes
daemonize yes
maxmemory 256mb
maxmemory-policy allkeys-lru
rename-command FLUSHALL ""
rename-command FLUSHDB ""
# requirepass <set on host, 32+ chars>
