# ShieldLayer — Reverse proxy with HTTPS + security headers
# Frontend: http://localhost:3456 (PM2 shieldlayer-frontend)
# API: http://localhost:8787 (PM2 shieldlayer-api)

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_HOST};

    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${SERVER_HOST};

    # SSL certificates (self-signed for now, replace with Let's Encrypt)
    ssl_certificate /etc/ssl/certs/gen1-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/gen1-selfsigned.key;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # max-age=0 clears prior HSTS so browsers can open http://IP:3456
    add_header Strict-Transport-Security "max-age=0" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://studio.genlayer.com https://rpc-asimov.genlayer.com https://*.walletconnect.com; frame-ancestors 'none';" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # API routes → Python backend
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8787;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3456;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
